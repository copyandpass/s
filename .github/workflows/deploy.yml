name: Build and Deploy to Docker Hub & Windows Server

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 소스코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2. Docker 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 3. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 환경 변수 확인 (들여쓰기 및 대시 '-' 추가 수정)
      - name: Check DOCKER_USERNAME exists
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -z "$DOCKER_USERNAME" ]; then
            echo "DOCKER_USERNAME secret is missing/empty."
            exit 1
          fi
          echo "DOCKER_USERNAME is set (length: ${#DOCKER_USERNAME})" 
        
      # 5. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/soncoding-server:latest
            ${{ secrets.DOCKER_USERNAME }}/soncoding-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      # 6. 빌드 성공 메시지
      - name: Image build successful
        run: echo "Docker image pushed to Docker Hub successfully"

  deploy-to-windows:
    needs: build-and-push
    runs-on: windows-latest
    
    steps:
      # 1. Windows Server에 SSH 접속 및 배포 스크립트 실행
      - name: Deploy to Windows Server
        shell: powershell
        run: |
          # Windows Server 정보
          $winHost = "${{ secrets.WIN_HOST }}"
          $winUser = "${{ secrets.WIN_USER }}"
          $winPass = "${{ secrets.WIN_PASS }}"
          
          Write-Host "Connecting to Windows Server: $winHost"
          
          # PowerShell Remoting을 이용한 접속
          $securePassword = ConvertTo-SecureString "$winPass" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($winUser, $securePassword)
          
          try {
            # 원격 세션 생성
            $session = New-PSSession -ComputerName $winHost -Credential $credential -ErrorAction Stop
            Write-Host "Successfully connected to Windows Server"
            
            # 배포 스크립트 실행
            Invoke-Command -Session $session -ScriptBlock {
              $deployPath = "C:\Users\$env:USERNAME\Desktop\soncoding-web"
              # 아래 이미지는 빌드한 이미지 명칭과 정확히 일치해야 합니다.
              $image = "${{ secrets.DOCKER_USERNAME }}/soncoding-server:latest"

              if (Test-Path $deployPath) {
                Set-Location $deployPath

                Write-Host "===== STOP & REMOVE EXISTING CONTAINER ====="
                try { docker stop soncoding-app -t 10 } catch {}
                try { docker rm soncoding-app -f } catch {}

                Write-Host "===== PULL LATEST IMAGE ====="
                docker pull $image

                Write-Host "===== RUN NEW CONTAINER ====="
                docker run -d --name soncoding-app --restart unless-stopped -p 80:8000 $image

                Write-Host "===== DEPLOYMENT COMPLETE ====="
              } else {
                Write-Host "Deploy path not found: $deployPath"
                exit 1
              }
            } -ErrorAction Stop
            
            Remove-PSSession $session
            Write-Host "Deployment completed successfully"
          } catch {
            Write-Host "Deployment failed: $_"
            exit 1
          }