name: Deploy to Windows Server

on:
  workflow_run:
    workflows: [ "CI/CD Pipeline" ]
    types: [ completed ]
    branches: [ main, master ]

jobs:
  deploy-to-windows:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    
    steps:
      # 1. Windows Server에 SSH 접속 및 배포 스크립트 실행
      - name: Deploy to Windows Server
        shell: powershell
        run: |
          # Windows Server 정보
          $winHost = "${{ secrets.WIN_HOST }}"
          $winUser = "${{ secrets.WIN_USER }}"
          $winPass = "${{ secrets.WIN_PASS }}"
          
          Write-Host "Connecting to Windows Server: $winHost"
          
          # PowerShell Remoting을 이용한 접속
          $securePassword = ConvertTo-SecureString "$winPass" -AsPlainText -Force
          $credential = New-Object System.Management.Automation.PSCredential($winUser, $securePassword)
          
          try {
            # 원격 세션 생성
            $session = New-PSSession -ComputerName $winHost -Credential $credential -UseSSL -SkipCACheck -SkipCNCheck -ErrorAction Stop
            Write-Host "Successfully connected to Windows Server"
            
            # 배포 스크립트 실행
            Invoke-Command -Session $session -ScriptBlock {
              $deployPath = "C:\Users\$env:USERNAME\Desktop\soncoding-web"
              # 아래 이미지는 빌드한 이미지 명칭과 정확히 일치해야 합니다.
              $image = "${{ secrets.DOCKER_USERNAME }}/soncoding-server:latest"

              if (Test-Path $deployPath) {
                Set-Location $deployPath

                Write-Host "===== STOP & REMOVE EXISTING CONTAINER ====="
                try { docker stop soncoding-app -t 10 } catch {}
                try { docker rm soncoding-app -f } catch {}

                Write-Host "===== PULL LATEST IMAGE ====="
                docker pull $image

                Write-Host "===== RUN NEW CONTAINER ====="
                docker run -d --name soncoding-app --restart unless-stopped -p 80:8000 $image

                Write-Host "===== DEPLOYMENT COMPLETE ====="
              } else {
                Write-Host "Deploy path not found: $deployPath"
                exit 1
              }
            } -ErrorAction Stop
            
            Remove-PSSession $session
            Write-Host "Deployment completed successfully"
          } catch {
            Write-Host "Deployment failed: $_"
            exit 1
          }